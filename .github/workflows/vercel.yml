name: CI and Vercel Deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    # Do not expose Vercel secrets to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing Actions secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing Actions secret VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing Actions secret VERCEL_PROJECT_ID"; exit 1; }
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel preview settings
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build Vercel preview
        if: github.event_name == 'pull_request'
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN"
      - name: Pull Vercel production settings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
